<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cola de karaoke</title>
<style>
:root{--bg:#14121a;--card:#1f1b29;--card2:#2a2437;--tx:#f2eef7;--mu:#9d93b0;--ac:#ff4f9a;--ok:#3ddc97;--wa:#ffc247;--bd:#3a3248}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0 0 6px}
#next{font-size:14px;color:var(--mu)}
#next b{color:var(--tx)}
nav{display:flex;gap:6px;margin-top:10px}
nav button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-weight:600}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label.t{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px}
label.t:first-child{margin-top:0}
input[type=text],input[type=number]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.grid button{padding:11px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:16px;font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1}
.seg button.on,.grid button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid button{padding:8px 0;line-height:1.1}
.grid button small{display:block;font-size:10px;font-weight:500;color:var(--mu);margin-top:2px;min-height:12px}
.grid button.on small{color:#ffe3ef}
.grid button.has{border-color:var(--ok)}
.big{width:100%;padding:15px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-size:17px;font-weight:700;margin-top:14px}
.info{font-size:14px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--card2)}
.warn{background:#3a2f12;border:1px solid var(--wa);color:#ffe2a0}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.pos{min-width:30px;height:30px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.item.first .pos{background:var(--ac)}
.item .m{flex:1;min-width:0}
.item .s{font-weight:700;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.mz{color:var(--ac);font-weight:700;margin-left:10px;white-space:nowrap}
.item .t2{font-size:16px;margin-top:2px;overflow-wrap:anywhere}
.item .d{font-size:13px;color:var(--mu)}
.item.extra .s{color:var(--mu)}
.kl{display:inline-block;margin-top:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:13px;font-weight:600;text-decoration:none}
.kl.ok{background:var(--ok);border-color:var(--ok);color:#06281a}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--mu);margin-left:4px}
.acts{display:flex;flex-direction:column;gap:6px}
.acts button,.sm{padding:9px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:14px;font-weight:600}
.acts .go{background:var(--ok);border-color:var(--ok);color:#06281a}
.sm.danger{border-color:#c0456a;color:#ff9ab9}
.sm.ok{background:var(--ok);border-color:var(--ok);color:#06281a}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.empty{color:var(--mu);text-align:center;padding:24px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000;border:1px solid var(--bd);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.hide{display:none}
.gl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.gl:last-child{border-bottom:0}
</style>
</head>
<body>
<header>
  <h1>Cola de karaoke</h1>
  <div id="next"></div>
  <div id="sync" style="font-size:12px;color:var(--mu);margin-top:4px"></div>
  <nav id="nav"></nav>
</header>
<main>
  <section id="v-cola"></section>

  <section id="v-add" class="hide">
    <div class="card">
      <label class="t">Zona</label>
      <div class="seg" id="zone"></div>
      <label class="t">Número de mesa</label>
      <div class="grid" id="mesas"></div>
      <div id="gstate"></div>
      <label class="t">Nombre</label>
      <input type="text" id="nombre" autocomplete="off" placeholder="Quien canta">
      <label class="t">Tema</label>
      <input type="text" id="tema" autocomplete="off" placeholder="Nombre de la canción">
      <label class="t">Artista</label>
      <input type="text" id="artista" autocomplete="off" placeholder="Quien la interpreta">
      <button class="big" id="addbtn">Agregar a la cola</button>
    </div>
  </section>

  <section id="v-mesas" class="hide"></section>

  <section id="v-set" class="hide">
    <div class="card">
      <label class="t">Minutos por turno (canción más cambio)</label>
      <input type="number" id="s-min" min="1" max="15">
      <label class="t">Espera máxima antes de sugerir 1 tema por grupo (min)</label>
      <input type="number" id="s-wait" min="10" max="240">
      <label class="t">Minutos sin actividad para preguntar si sigue el mismo grupo</label>
      <input type="number" id="s-stale" min="10" max="240">
      <label class="t">Temas seguidos por mesa en su turno</label>
      <div class="seg" id="s-seg"></div>
      <label class="t">Modo apurado</label>
      <div class="seg" id="s-apurado"></div>
    </div>
    <div class="card">
      <label class="t">Clave de YouTube (se pega una sola vez en este navegador)</label>
      <input type="text" id="s-yt" placeholder="AIza..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="d" id="yt-state" style="color:var(--mu);font-size:13px;margin-top:6px"></div>
    </div>
    <div class="card">
      <b>Nueva noche</b>
      <div class="d" style="color:var(--mu);font-size:14px;margin:6px 0 10px">Borra mesas, cola e historial para empezar desde cero.</div>
      <button class="sm danger" id="reset"></button>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const KEY='karaoke-cola-v1';
let S={groups:[],slips:[],set:{min:5,maxWait:60,staleMin:75,apurado:false,seguidos:3,maxEsp:20},seq:1,gseq:1};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);S=Object.assign(S,p);S.set=Object.assign({min:5,maxWait:60,staleMin:75,apurado:false,seguidos:3,maxEsp:20},p.set||{});}}catch(e){}
let remoteRef=null,pushT=null,pushing=false;
function setSync(t){const e=document.getElementById('sync');if(e)e.textContent=t;}
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  schedulePush();
}
function schedulePush(){if(!remoteRef)return;clearTimeout(pushT);pushT=setTimeout(pushRemote,600);}
async function pushRemote(){
  if(!remoteRef)return;
  if(pushing){schedulePush();return;}
  pushing=true;
  try{await remoteRef.set({updated:S.updated||Date.now(),json:JSON.stringify(S)});setSync('Cola guardada en la nube');}
  catch(e){setSync('No se pudo guardar en la nube, la cola sigue en este navegador');}
  pushing=false;
}
function adopt(d){
  try{
    const r=JSON.parse(d.json);
    S=Object.assign({groups:[],slips:[],set:{},seq:1,gseq:1},r);
    S.set=Object.assign({min:5,maxWait:60,staleMin:75,apurado:false,seguidos:3,maxEsp:20},r.set||{});
    S.updated=d.updated||Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();
  }catch(e){}
}
async function initDb(){
  setSync('La cola se guarda en este navegador');
  let db=null;
  try{if(typeof claude!=='undefined'&&claude.use)db=await claude.use('db');}catch(e){}
  if(!db){setSync('La cola se guarda en este navegador');return;}
  remoteRef=db.doc('karaoke/estado');
  let first=true;
  const timer=setTimeout(()=>{if(first)setSync('Sin respuesta de la nube, la cola se guarda solo en este navegador');},10000);
  remoteRef.onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;
    if(d&&typeof d.json==='string'){
      if((d.updated||0)>(S.updated||0)){adopt(d);}
      else if((S.updated||0)>(d.updated||0)&&!snap.metadata.hasPendingWrites&&!snap.metadata.fromCache){schedulePush();}
    }else if(!snap.metadata.fromCache&&(S.slips.length||S.groups.length)){
      S.updated=Date.now();schedulePush();
    }
    if(!snap.metadata.fromCache){first=false;clearTimeout(timer);setSync('Cola guardada en la nube');}
  },()=>{setSync('Nube no disponible, la cola se guarda solo en este navegador');});
}
const YTK='karaoke-ytkey',YTC='karaoke-ytcache';
const ytKey=()=>{try{return(localStorage.getItem(YTK)||'').trim();}catch(e){return'';}};
function ytCache(){try{return JSON.parse(localStorage.getItem(YTC)||'{}');}catch(e){return{};}}
async function findLink(s){
  const key=ytKey();
  if(!key)return;
  const q=('karaoke '+s.tema+' '+(s.artista||'')).trim().toLowerCase().replace(/\s+/g,' ');
  const cache=ytCache();
  if(cache[q]){s.link=cache[q].link;s.ltitle=cache[q].title;s.lstate='ok';save();render();return;}
  s.lstate='buscando';render();
  try{
    const u='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&videoEmbeddable=any&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(key);
    const r=await fetch(u);
    const j=await r.json();
    if(!r.ok){s.lstate=(j&&j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason==='quotaExceeded')?'cuota':'error';}
    else if(j.items&&j.items[0]){
      const it=j.items[0];
      s.link='https://www.youtube.com/watch?v='+it.id.videoId;
      s.ltitle=(it.snippet&&it.snippet.title||'').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"');
      s.lstate='ok';
      cache[q]={link:s.link,title:s.ltitle};
      try{localStorage.setItem(YTC,JSON.stringify(cache));}catch(e){}
    }else s.lstate='error';
  }catch(e){s.lstate='error';}
  save();render();
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ui={tab:'cola',zone:'P',mesa:null,people:null,stale:null,staleOk:false,confirm:null,resetConfirm:false};
const ZN={P:'Patio',S:'Salón'};
const PEOPLE=[['1-2',2],['3-4',4],['5',5],['6 o más',6]];

function quota(g){if(S.set.apurado)return 1;const p=g.people;return p<=2?1:p<=4?2:p===5?2:3;}
function qFor(p){return p<=2?1:p<=4?2:p===5?2:3;}
function baseQuota(g){const p=g.people;return p<=2?1:p<=4?2:p===5?2:3;}
function openGroup(z,m){return S.groups.find(g=>g.open&&g.zone===z&&g.mesa===m);}
function gById(id){return S.groups.find(g=>g.id===id);}
function createGroup(z,m,p){
  const n=S.groups.filter(g=>g.zone===z&&g.mesa===m).length;
  const g={id:S.gseq++,zone:z,mesa:m,people:p,letter:String.fromCharCode(65+(n%26)),open:true,last:Date.now()};
  S.groups.push(g);return g;
}
function label(g){return ZN[g.zone]+' '+g.mesa+'-'+g.letter;}
function peopleLabel(p){return p>=6?'6 o más':(PEOPLE.find(x=>x[1]===p)||['?'])[0];}

function kl(s){
  if(s.lstate==='buscando')return `<span class="kl">Buscando karaoke...</span>`;
  const q=encodeURIComponent('karaoke '+s.tema+(s.artista?' '+s.artista:''));
  if(s.link&&/^https?:\/\//.test(s.link))return `<a class="kl ok" href="${esc(s.link)}" target="_blank" rel="noopener">▶ Karaoke</a>${s.ltitle?`<div class="d" style="font-size:12px;color:var(--mu);overflow-wrap:anywhere">${esc(s.ltitle)}</div>`:''}`;
  const why=s.lstate==='cuota'?' (se acabó la cuota de hoy)':'';
  return `<a class="kl" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Buscar karaoke${why}</a>`;
}
function ttl(s){return s.tema+(s.artista?' - '+s.artista:'');}
function nm(s){return (s&&s.nombre||'').trim().toLowerCase();}
// Reordena una lista para que la misma persona no cante dos veces seguidas, cuando hay otra opción.
function spread(list,prev){
  const rem=list.slice(),res=[];prev=prev||'';
  while(rem.length){
    let i=prev?rem.findIndex(s=>nm(s)!==prev):0;if(i<0)i=0;
    const s=rem.splice(i,1)[0];res.push(s);prev=nm(s);
  }
  return res;
}
// El cupo vale por turno, no por noche. Las hojas de una mesa se agrupan en turnos de hasta "cupo" temas.
// Un turno se cierra cuando se llena o cuando, después de que la mesa cantó, cantó otra mesa (la mesa vuelve a pedir con cupo nuevo).
function assign(){
  const byG={};
  S.slips.filter(s=>s.status!=='skipped').sort((a,b)=>a.t-b.t).forEach(s=>{(byG[s.g]=byG[s.g]||[]).push(s);});
  // Dentro de cada mesa: primero lo ya cantado (en el orden en que se cantó) y luego lo pendiente.
  // Entre lo pendiente, quien aún no cantó va antes que quien repite: se ordena por número de tema de esa persona y luego por llegada.
  Object.keys(byG).forEach(key=>{
    const all=byG[key];
    const dn=all.filter(s=>s.status==='done').sort((a,b)=>(a.dt-b.dt)||(a.t-b.t));
    const qd=all.filter(s=>s.status!=='done');
    const cnt={};
    const nk=s=>(s.nombre||'').trim().toLowerCase();
    dn.forEach(s=>{const n=nk(s);if(n)cnt[n]=(cnt[n]||0)+1;});
    qd.forEach(s=>{const n=nk(s);if(!n){s._r=1;return;}cnt[n]=(cnt[n]||0)+1;s._r=cnt[n];});
    qd.sort((a,b)=>(a._r-b._r)||(a.t-b.t));
    byG[key]=dn.concat(qd);
  });
  const dones=S.slips.filter(s=>s.status==='done');
  const info={};
  Object.keys(byG).forEach(key=>{
    const id=+key,g=gById(id);if(!g)return;
    const qt=quota(g);
    const passed=cur=>cur.lastDt>0&&dones.some(d=>d.g!==id&&d.dt>cur.lastDt);
    let b=0,cur={n:0,lastDt:0};
    byG[key].forEach(s=>{
      if(cur.n>=qt||passed(cur)){b++;cur={n:0,lastDt:0};}
      cur.n++;s.b=b;s.k=cur.n;
      if(s.status==='done'&&s.dt>cur.lastDt)cur.lastDt=s.dt;
    });
    info[id]=passed(cur)?0:cur.n;
  });
  return info;
}
function used(g){return assign()[g.id]||0;}
function compute(){
  assign();
  const q=S.slips.filter(s=>s.status==='queued');
  const firstB={};
  q.forEach(s=>{if(!(s.g in firstB)||s.b<firstB[s.g])firstB[s.g]=s.b;});
  q.forEach(s=>{s.extra=s.b>firstB[s.g];});
  const sorted=q.slice().sort((a,b)=>((a.extra?1:0)-(b.extra?1:0))||(a.k-b.k)||(a.t-b.t));
  const done=S.slips.filter(s=>s.status==='done').sort((a,b)=>b.dt-a.dt);
  const out=[];
  const c=S.set.seguidos||1;
  if(c>1){
    // Cada mesa canta hasta c temas seguidos en su turno. El turno de cada mesa lo fija la hora de su primera hoja.
    const ld={};done.forEach(s=>{if(!(s.g in ld))ld[s.g]=s.dt;});
    const build=(list,size,target)=>{
      target=target||out;
      size=size||c;
      const by={},order=[];
      list.slice().sort((a,b)=>a.t-b.t).forEach(s=>{if(!by[s.g]){by[s.g]=[];order.push(s.g);}by[s.g].push(s);});
      // El lugar de cada mesa lo marca el momento en que quedó lista: la hora de su hoja, o la de su último "Cantó" si es posterior.
      const key={};order.forEach(g=>{key[g]=Math.max(by[g][0].t,ld[g]||0);});
      order.sort((a,b)=>key[a]-key[b]);
      order.forEach(g=>{by[g]=spread(by[g].slice().sort((x,y)=>x.k-y.k),'');});
      let left=list.length;
      while(left>0){
        order.forEach(g=>{const n=by[g].splice(0,size);n.forEach(s=>target.push(s));left-=n.length;});
      }
    };
    // Los bloques no se cortan. Orden: 1) lo que falta del bloque en curso (mesa del último "Cantó"),
    // 2) mesas que aún no cantaron, por hora de su primera hoja, 3) mesas que ya cantaron, 4) extras.
    const el=q.filter(s=>!s.extra);
    const doneG=new Set(done.map(s=>s.g));
    const lastG=done.length?done[0].g:null;
    const lastB=done.length?done[0].b:null;
    const inCourse=s=>s.g===lastG&&s.b===lastB;
    spread(el.filter(inCourse).sort((a,b)=>a.k-b.k),done.length?nm(done[0]):'').forEach(s=>out.push(s));
    const rest=el.filter(s=>!inCourse(s));
    // Las mesas nuevas (que aún no cantaron) van primero. Las que ya cantaron van después, la que lleva más tiempo sin cantar primero.
    // Un bloque ya ubicado no baja por el paso del tiempo, solo por la llegada de una mesa nueva.
    build(rest.filter(s=>!doneG.has(s.g)));
    build(rest.filter(s=>doneG.has(s.g)));
    // Turnos siguientes: al final. Cada turno de una mesa es un bloque (hasta su cupo, seguidos).
    // Primero los bloques del turno 2 de todas las mesas, luego los del turno 3, etc. Un bloque no va pegado al de la misma mesa si hay otra opción.
    const bg={};
    q.filter(s=>s.extra).forEach(s=>{const m=bg[s.g]=bg[s.g]||{};(m[s.b]=m[s.b]||[]).push(s);});
    const ranks=[];
    Object.keys(bg).forEach(g=>{
      Object.keys(bg[g]).map(Number).sort((a,b)=>a-b).forEach((b,r)=>{
        const sl=bg[g][b].sort((x,y)=>x.k-y.k);
        (ranks[r]=ranks[r]||[]).push({g:+g,t:Math.max(Math.min(...sl.map(x=>x.t)),ld[+g]||0),sl:spread(sl,'')});
      });
    });
    let prevG=out.length?out[out.length-1].g:(done.length?done[0].g:null);
    ranks.forEach(list=>{
      const rem=list.slice().sort((x,y)=>x.t-y.t);
      while(rem.length){
        let i=rem.findIndex(bk=>bk.g!==prevG);if(i<0)i=0;
        const bk=rem.splice(i,1)[0];bk.sl.forEach(s=>out.push(s));prevG=bk.g;
      }
    });
  }else{
    let last=done.length?done[0].g:null;
    [sorted.filter(s=>!s.extra),sorted.filter(s=>s.extra)].forEach(list=>{
      const rem=list.slice();
      while(rem.length){
        let i=rem.findIndex(s=>s.g!==last);if(i<0)i=0;
        const s=rem.splice(i,1)[0];out.push(s);last=s.g;
      }
    });
  }
  return {queue:out,done};
}

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2600);}

function renderNav(){
  const tabs=[['cola','Cola'],['add','Agregar'],['mesas','Mesas'],['set','Ajustes']];
  $('nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}" class="${ui.tab===t[0]?'on':''}">${t[1]}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.t;render();});
  ['cola','add','mesas','set'].forEach(k=>$('v-'+k).classList.toggle('hide',ui.tab!==k));
}

function renderNext(c){
  const n=c.queue[0];
  $('next').innerHTML=n?`Sigue: <b>${esc(n.nombre||'sin nombre')}</b> de la mesa ${gById(n.g).mesa} (${ZN[gById(n.g).zone]}), canta${esc(ttl(n))}`:'La cola está vacía';
}

function renderCola(c){
  const q=c.queue;const min=S.set.min;
  const eligible=q.filter(s=>!s.extra).length;
  let h='';
  const total=eligible*min;
  if(S.set.apurado){
    h+=`<div class="info warn">Modo apurado activo: 1 tema por grupo. <button class="sm" id="apOff" style="margin-left:6px">Desactivar</button></div>`;
  }else if(total>S.set.maxWait){
    h+=`<div class="info warn">La última hoja de la cola espera unos ${total} min. Con 1 tema por grupo la cola se acorta. <button class="sm" id="apOn" style="margin-top:8px">Activar 1 tema por grupo</button></div>`;
  }
  h+=`<div class="card" style="margin-top:12px">`;
  if(!q.length)h+=`<div class="empty">Agrega hojas en la pestaña Agregar y aquí aparece el orden.</div>`;
  q.forEach((s,i)=>{
    const g=gById(s.g);
    const wait=i===0?'Sigue':'en ~'+(i*min)+' min';
    h+=`<div class="item ${i===0?'first':''} ${s.extra?'extra':''}">
      <div class="pos">${i+1}</div>
      <div class="m"><div class="s">${esc(s.nombre||'Sin nombre')}<span class="mz">Mesa ${g.mesa}</span></div>
      <div class="t2">${esc(ttl(s))}</div>
      <div class="d">${ZN[g.zone]}, tema ${s.k} de ${quota(g)}${s.extra?'<span class="tag">próximo turno</span>':''}</div>
      <div class="d" style="color:${i===0?'var(--ok)':'var(--mu)'}">${wait}</div>${kl(s)}</div>
      <div class="acts"><button class="go" data-a="done" data-id="${s.id}">Cantó</button><button data-a="skip" data-id="${s.id}">Quitar</button></div>
    </div>`;
  });
  h+=`</div>`;
  const d=c.done.slice(0,6);
  if(d.length){
    h+=`<h2>Ya cantaron</h2><div class="card">`;
    d.forEach(s=>{h+=`<div class="gl"><div><b>${esc(s.nombre||'Sin nombre')}</b><span class="mz">Mesa ${gById(s.g).mesa}</span><div class="d" style="font-size:13px;color:var(--mu)">${esc(ttl(s))}</div></div><button class="sm" data-a="undo" data-id="${s.id}">Volver a cola</button></div>`;});
    h+=`</div>`;
  }
  $('v-cola').innerHTML=h;
  const on=$('apOn');if(on)on.onclick=()=>{S.set.apurado=true;save();render();};
  const off=$('apOff');if(off)off.onclick=()=>{S.set.apurado=false;save();render();};
  $('v-cola').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const s=S.slips.find(x=>x.id===+b.dataset.id);if(!s)return;
    if(b.dataset.a==='done'){s.status='done';s.dt=Date.now();}
    if(b.dataset.a==='skip'){s.status='skipped';}
    if(b.dataset.a==='undo'){s.status='queued';delete s.dt;}
    save();render();
  });
}

function renderAdd(){
  $('zone').innerHTML=Object.keys(ZN).map(z=>`<button data-z="${z}" class="${ui.zone===z?'on':''}">${ZN[z]}</button>`).join('');
  $('zone').querySelectorAll('button').forEach(b=>b.onclick=()=>{ui.zone=b.dataset.z;ui.mesa=null;ui.people=null;ui.stale=null;renderAdd();});
  let mh='';
  for(let m=1;m<=12;m++){
    const g=openGroup(ui.zone,m);
    const sub=g?`${g.letter} · ${used(g)}/${quota(g)}`:'libre';
    mh+=`<button data-m="${m}" class="${ui.mesa===m?'on':''} ${g?'has':''}">${m}<small>${sub}</small></button>`;
  }
  $('mesas').innerHTML=mh;
  $('mesas').querySelectorAll('button').forEach(b=>b.onclick=()=>{ui.mesa=+b.dataset.m;ui.people=null;ui.stale=null;ui.staleOk=false;ui.over=null;renderAdd();});
  let st='';
  if(ui.mesa){
    const g=openGroup(ui.zone,ui.mesa);
    if(ui.over&&g){
      const bigger=S.set.apurado?[]:PEOPLE.filter(p=>qFor(p[1])>quota(g));
      st=`<div class="info warn">La hoja no se agregó: ${esc(label(g))} tiene ${peopleLabel(g.people)} personas y su cupo es ${quota(g)} ${quota(g)===1?'tema':'temas'}, que ya completó.
        ${bigger.length?`<div style="margin-top:8px">Si el grupo es más grande, corrige su tamaño:</div><div class="row" style="margin-top:8px">${bigger.map(p=>`<button class="sm" data-fix="${p[1]}">${p[0]}</button>`).join('')}</div>`:''}
        <div class="row" style="margin-top:10px"><button class="sm" id="ovNo">Entendido</button></div></div>`;
    }else if(ui.stale&&g){
      st=`<div class="info warn">La ${esc(label(g))} no tuvo actividad hace rato. ¿Sigue el mismo grupo?
        <div class="row" style="margin-top:10px"><button class="sm ok" id="sameG">Sí, el mismo grupo</button><button class="sm" id="newG">Gente nueva</button></div></div>`;
    }else if(g){
      st=`<div class="info"><b>${esc(label(g))}</b>, ${peopleLabel(g.people)} personas, lleva ${used(g)} de ${quota(g)} temas.</div>`;
    }else{
      st=`<label class="t">Mesa nueva, ¿cuántas personas son?</label><div class="seg" id="ppl">${PEOPLE.map(p=>`<button data-p="${p[1]}" class="${ui.people===p[1]?'on':''}">${p[0]}</button>`).join('')}</div>`;
    }
  }
  $('gstate').innerHTML=st;
  const pp=$('ppl');if(pp)pp.querySelectorAll('button').forEach(b=>b.onclick=()=>{ui.people=+b.dataset.p;renderAdd();});
  $('gstate').querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{const g=openGroup(ui.zone,ui.mesa);if(g){g.people=+b.dataset.fix;}ui.over=null;save();render();toast('Tamaño corregido, vuelve a tocar Agregar');});
  const no=$('ovNo');if(no)no.onclick=()=>{ui.over=null;renderAdd();};  const sg=$('sameG');if(sg)sg.onclick=()=>{const g=openGroup(ui.zone,ui.mesa);g.last=Date.now();ui.stale=null;save();renderAdd();};
  const ng=$('newG');if(ng)ng.onclick=()=>{const g=openGroup(ui.zone,ui.mesa);closeGroup(g);ui.stale=null;ui.people=null;save();renderAdd();};
}
function closeGroup(g){g.open=false;S.slips.forEach(s=>{if(s.g===g.id&&s.status==='queued')s.status='skipped';});}

function submitSlip(){
  const tema=$('tema').value.trim(),nombre=$('nombre').value.trim(),artista=$('artista').value.trim();
  if(!ui.mesa){toast('Elige la mesa');return;}
  if(!tema){toast('Escribe el tema');return;}
  let g=openGroup(ui.zone,ui.mesa);
  if(g){
    const hasQueued=S.slips.some(s=>s.g===g.id&&s.status==='queued');
    if(!hasQueued&&Date.now()-g.last>S.set.staleMin*60000&&!ui.staleChecked){ui.stale=g.id;renderAdd();return;}
  }
  ui.overOk=false;ui.over=null;
  if(!g){
    if(!ui.people){toast('Elige cuántas personas son');return;}
    g=createGroup(ui.zone,ui.mesa,ui.people);
  }
  g.last=Date.now();
  const s={id:S.seq++,g:g.id,tema,nombre,artista,t:Date.now(),status:'queued'};
  S.slips.push(s);
  compute();
  $('tema').value='';$('nombre').value='';$('artista').value='';
  ui.people=null;ui.stale=null;ui.mesa=null;
  save();render();
  toast(s.extra?'Agregado para el próximo turno de la mesa, queda al final':'Agregado a la cola');
  findLink(s);
}

function sizeKey(p){return p>=6?6:p;}
function sizeBtns(g){return PEOPLE.map(p=>`<button data-sz="${g.id}:${p[1]}" class="${sizeKey(g.people)===p[1]?'on':''}">${p[0]}</button>`).join('');}
function setSize(str){
  const [id,v]=str.split(':').map(Number);const g=gById(id);
  if(!g)return;
  g.people=v;save();render();
  toast(label(g)+': '+peopleLabel(v)+' personas, cupo '+quota(g)+(quota(g)===1?' tema':' temas'));
}
function renderMesas(){
  const gs=S.groups.filter(g=>g.open).sort((a,b)=>(a.zone===b.zone?a.mesa-b.mesa:a.zone<b.zone?1:-1));
  let h='';
  if(!gs.length)h=`<div class="empty">Todavía no hay mesas activas.</div>`;
  else{
    h=`<div class="card">`;
    gs.forEach(g=>{
      const conf=ui.confirm===g.id;
      h+=`<div class="gl" style="flex-wrap:wrap"><div><b>${esc(label(g))}</b><div style="font-size:13px;color:var(--mu)">${peopleLabel(g.people)} personas, ${used(g)} de ${quota(g)} temas</div></div>
      <button class="sm ${conf?'danger':''}" data-g="${g.id}">${conf?'Confirmar: se fue':'Mesa se fue'}</button>
      <div style="width:100%;font-size:13px;color:var(--mu);margin-top:6px">Tamaño del grupo</div>
      <div class="seg" style="width:100%">${sizeBtns(g)}</div></div>`;
    });
    h+=`</div><div class="info">Cuando una mesa se va, tócala aquí. La próxima vez que ingreses ese número, la app pedirá la cantidad de personas y contará desde cero.</div>`;
  }
  $('v-mesas').innerHTML=h;
  $('v-mesas').querySelectorAll('[data-sz]').forEach(b=>b.onclick=()=>setSize(b.dataset.sz));
  $('v-mesas').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.g;
    if(ui.confirm===id){closeGroup(gById(id));ui.confirm=null;save();render();toast('Mesa liberada');}
    else{ui.confirm=id;renderMesas();}
  });
}

function renderSet(){
  $('s-min').value=S.set.min;$('s-wait').value=S.set.maxWait;$('s-stale').value=S.set.staleMin;
  $('s-apurado').innerHTML=`<button data-v="0" class="${!S.set.apurado?'on':''}">Normal</button><button data-v="1" class="${S.set.apurado?'on':''}">1 tema por grupo</button>`;
  $('s-apurado').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.set.apurado=b.dataset.v==='1';save();render();});
  $('s-seg').innerHTML=[[1,'1 (rondas)'],[2,'Hasta 2'],[3,'Hasta 3']].map(x=>`<button data-v="${x[0]}" class="${(S.set.seguidos||1)===x[0]?'on':''}">${x[1]}</button>`).join('');
  $('s-seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.set.seguidos=+b.dataset.v;save();render();});
  if(document.activeElement!==$('s-yt'))$('s-yt').value=ytKey();
  $('yt-state').textContent=ytKey()?'Búsqueda automática activada.':'Sin clave: las hojas muestran el botón Buscar karaoke.';
  $('reset').textContent=ui.resetConfirm?'Confirmar: borrar todo':'Empezar nueva noche';
}

function render(){
  const c=compute();
  renderNav();renderNext(c);renderCola(c);renderAdd();renderMesas();renderSet();
}

$('addbtn').onclick=submitSlip;
$('nombre').addEventListener('keydown',e=>{if(e.key==='Enter')$('tema').focus();});
$('tema').addEventListener('keydown',e=>{if(e.key==='Enter')$('artista').focus();});
$('artista').addEventListener('keydown',e=>{if(e.key==='Enter')submitSlip();});
[['s-min','min',1],['s-wait','maxWait',10],['s-stale','staleMin',10]].forEach(([id,k,mn])=>{
  $(id).addEventListener('change',()=>{const v=parseInt($(id).value,10);if(v>=mn){S.set[k]=v;save();render();}});
});
$('s-yt').addEventListener('change',()=>{try{localStorage.setItem(YTK,$('s-yt').value.trim());}catch(e){}render();toast('Clave guardada');});
$('reset').onclick=()=>{
  if(ui.resetConfirm){S.groups=[];S.slips=[];S.seq=1;S.gseq=1;ui.resetConfirm=false;ui.mesa=null;save();render();toast('Noche nueva lista');}
  else{ui.resetConfirm=true;renderSet();setTimeout(()=>{ui.resetConfirm=false;renderSet();},5000);}
};
render();
initDb();
setInterval(()=>{if(ui.tab==='cola')render();},30000);
</script>
</body>
</html>
